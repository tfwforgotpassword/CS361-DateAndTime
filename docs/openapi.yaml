openapi: 3.0.3
info:
  title: Date and Time Tracker API
  description: |
    Stateless microservice for calendar-accurate date and time arithmetic.

    Calendar rules: All arithmetic follows the Gregorian calendar, including
    leap years. When a month/year offset lands on a nonexistent day
    (e.g., Jan 31 + 1 month), the result is **clamped to the last valid day**
    of the target month (Feb 28 or Feb 29).

    Time zones: Time zone names must be IANA identifiers (e.g.,
    `America/New_York`). If `time_zone` is omitted, UTC is assumed. Naive
    datetimes (no offset) are interpreted in the request's `time_zone`.

    Date formats: Inputs use ISO 8601. A date-only input (`2026-01-31`)
    produces a date-only result; a datetime input (`2026-01-31T09:30:00`)
    produces a datetime result with its UTC offset.

    Errors: Every error response uses the same JSON shape
    (`error_code`, `message`, `field`). See the `ErrorResponse` schema.

    Timing header: Every response includes an `X-Process-Time-Ms` header
    with the server-side processing time in milliseconds.
  version: 1.0.0
  contact:
    name: Date/Time Tracker Owner

servers:
  - url: http://localhost:8000
    description: Local development (HTTP)

tags:
  - name: System
    description: Service health and metadata
  - name: DateTime
    description: Current date and time lookup
  - name: Dates
    description: Date and time arithmetic

paths:
  /health:
    get:
      tags: [System]
      summary: Liveness check
      description: Returns 200 if the service is running. Used by the Security Dashboard health panel.
      operationId: getHealth
      responses:
        "200":
          description: Service is alive.
          headers:
            X-Process-Time-Ms:
              $ref: "#/components/headers/X-Process-Time-Ms"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: ok
                service: date-time-tracker
                version: 1.0.0
                utc_time: "2026-11-16T23:47:00.123456Z"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/datetime/current:
    get:
      tags: [DateTime]
      summary: Get the current date and time in a time zone
      description: |
        Returns the current date (`YYYY-MM-DD`) and time (`HH:MM:SS`, 24-hour)
        in the requested IANA time zone, plus its current UTC offset and the
        combined ISO 8601 datetime. If `timezone` is omitted, UTC is used.
      operationId: getCurrentTime
      parameters:
        - name: timezone
          in: query
          required: false
          description: IANA time zone name.
          schema:
            type: string
            default: UTC
            example: America/Los_Angeles
      responses:
        "200":
          description: Current date and time.
          headers:
            X-Process-Time-Ms:
              $ref: "#/components/headers/X-Process-Time-Ms"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentTimeResponse"
              example:
                timezone: America/Los_Angeles
                date: "2026-11-16"
                time: "16:52:03"
                utc_offset: "-08:00"
                iso_datetime: "2026-11-16T16:52:03-08:00"
        "400":
          description: |
            **400 Bad Request.** The `timezone` value is not a valid IANA time zone.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error_code: INVALID_INPUT
                message: "'Mars/Olympus_Mons' is not a valid IANA time zone"
                field: timezone
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/datetime/countdown:
    get:
      tags: [DateTime]
      summary: Get the time remaining until a target date or datetime
      description: |
        Returns the time remaining from now until `target`, broken down into
        days, hours (0-23), minutes (0-59) and seconds (0-59), plus the total
        in seconds. If `unit` is given, `value` also gives the time remaining
        as full units of that kind (partial units are dropped).

        Real elapsed time is counted, so the result is correct across daylight
        saving time changes. If the target has already been reached,
        `has_passed` is `true` and every number is `0` (this is not an error).
      operationId: getCountdown
      parameters:
        - name: target
          in: query
          required: true
          description: |
            ISO 8601 date or datetime to count down to. A date alone means
            midnight at the start of that day.
          schema:
            type: string
            example: "2026-12-25"
        - name: timezone
          in: query
          required: false
          description: IANA time zone used for a `target` with no UTC offset.
          schema:
            type: string
            default: UTC
            example: America/Los_Angeles
        - name: unit
          in: query
          required: false
          description: Also express the time remaining in this unit.
          schema:
            type: string
            enum: [days, hours, minutes, seconds]
      responses:
        "200":
          description: Countdown calculated successfully.
          headers:
            X-Process-Time-Ms:
              $ref: "#/components/headers/X-Process-Time-Ms"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CountdownResponse"
              example:
                target: "2026-12-25"
                timezone: America/Los_Angeles
                now: "2026-11-16T17:00:00-08:00"
                has_passed: false
                remaining: { days: 38, hours: 7, minutes: 0, seconds: 0 }
                total_seconds: 3308400
                unit: hours
                value: 919
        "400":
          description: |
            **400 Bad Request.** `target` is not a valid ISO 8601 date or
            datetime, or `timezone` is not a valid IANA time zone.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error_code: INVALID_INPUT
                message: "'next friday' is not a valid ISO 8601 date or datetime"
                field: target
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/dates/add:
    post:
      tags: [Dates]
      summary: Add a duration to a date or datetime
      description: |
        Adds the given duration to `start`. Years and months are applied first
        (with clamping to the last valid day of the month), then days, hours,
        minutes and seconds.
      operationId: addDuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddSubtractRequest"
            examples:
              simpleDays:
                summary: Add 10 days to a date
                value:
                  start: "2026-01-15"
                  duration: { days: 10 }
              monthClamping:
                summary: Add 1 month to Jan 31 (clamped to Feb 28)
                value:
                  start: "2026-01-31"
                  duration: { months: 1 }
              datetimeWithZone:
                summary: Add hours and minutes to a datetime in New York
                value:
                  start: "2026-11-01T09:30:00"
                  duration: { hours: 5, minutes: 15 }
                  time_zone: America/New_York
      responses:
        "200":
          description: Duration added successfully.
          headers:
            X-Process-Time-Ms:
              $ref: "#/components/headers/X-Process-Time-Ms"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddSubtractResponse"
              examples:
                monthClamping:
                  summary: Jan 31 + 1 month
                  value:
                    start: "2026-01-31"
                    duration: { years: 0, months: 1, days: 0, hours: 0, minutes: 0, seconds: 0 }
                    result: "2026-02-28"
                    clamped: true
                    time_zone: UTC
                datetimeWithZone:
                  summary: Datetime + 5h 15m in New York
                  value:
                    start: "2026-11-01T09:30:00"
                    duration: { years: 0, months: 0, days: 0, hours: 5, minutes: 15, seconds: 0 }
                    result: "2026-11-01T14:45:00-05:00"
                    clamped: false
                    time_zone: America/New_York
        "400":
          $ref: "#/components/responses/InvalidInput"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/dates/subtract:
    post:
      tags: [Dates]
      summary: Subtract a duration from a date or datetime
      description: |
        Subtracts the given duration from `start`. Send the duration as
        **positive** numbers; the endpoint applies them backwards. In the
        response, `duration` is echoed with **negative** values to show that
        it was subtracted. The same clamping rules as `/add` apply.
      operationId: subtractDuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddSubtractRequest"
            example:
              start: "2026-03-31"
              duration: { months: 1 }
      responses:
        "200":
          description: Duration subtracted successfully.
          headers:
            X-Process-Time-Ms:
              $ref: "#/components/headers/X-Process-Time-Ms"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddSubtractResponse"
              example:
                start: "2026-03-31"
                duration: { years: 0, months: -1, days: 0, hours: 0, minutes: 0, seconds: 0 }
                result: "2026-02-28"
                clamped: true
                time_zone: UTC
        "400":
          $ref: "#/components/responses/InvalidInput"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/dates/difference:
    post:
      tags: [Dates]
      summary: Calculate the difference between two dates or datetimes
      description: |
        Returns the gap between `start` and `end` both as a calendar breakdown
        (years, months, days) and as totals (days and seconds).

        All numbers are always non-negative. `sign` gives the direction:
        `1` if `end` is on or after `start`, `-1` if `end` is before `start`.

        If `unit` is given, `value` also gives the difference as full units of
        that kind. Days and weeks come from `total_days`; months and years
        follow the calendar breakdown.
      operationId: dateDifference
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DifferenceRequest"
            examples:
              forward:
                summary: End is after start
                value:
                  start: "2024-02-29"
                  end: "2026-03-01"
              reversed:
                summary: End is before start (sign = -1)
                value:
                  start: "2026-03-01"
                  end: "2024-02-29"
              withUnit:
                summary: Difference in weeks
                value:
                  start: "2024-02-29"
                  end: "2026-03-01"
                  unit: weeks
      responses:
        "200":
          description: Difference calculated successfully.
          headers:
            X-Process-Time-Ms:
              $ref: "#/components/headers/X-Process-Time-Ms"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DifferenceResponse"
              examples:
                forward:
                  summary: 2024-02-29 to 2026-03-01
                  value:
                    start: "2024-02-29"
                    end: "2026-03-01"
                    sign: 1
                    calendar: { years: 2, months: 0, days: 1 }
                    total_days: 731
                    total_seconds: 63158400
                    unit: null
                    value: null
                withUnit:
                  summary: 2024-02-29 to 2026-03-01 in weeks
                  value:
                    start: "2024-02-29"
                    end: "2026-03-01"
                    sign: 1
                    calendar: { years: 2, months: 0, days: 1 }
                    total_days: 731
                    total_seconds: 63158400
                    unit: weeks
                    value: 104
                reversed:
                  summary: 2026-03-01 to 2024-02-29
                  value:
                    start: "2026-03-01"
                    end: "2024-02-29"
                    sign: -1
                    calendar: { years: 2, months: 0, days: 1 }
                    total_days: 731
                    total_seconds: 63158400
                    unit: null
                    value: null
        "400":
          $ref: "#/components/responses/InvalidInput"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  headers:
    X-Process-Time-Ms:
      description: Server-side processing time for the request, in milliseconds (3 decimal places).
      schema:
        type: string
        example: "0.842"

  schemas:
    Duration:
      type: object
      description: |
        An amount of time. Every field is optional and defaults to 0, but at
        least one field must be greater than 0. Negative values are not
        allowed; choose `/add` or `/subtract` to set the direction.
      properties:
        years:
          type: integer
          minimum: 0
          default: 0
        months:
          type: integer
          minimum: 0
          default: 0
        days:
          type: integer
          minimum: 0
          default: 0
        hours:
          type: integer
          minimum: 0
          default: 0
        minutes:
          type: integer
          minimum: 0
          default: 0
        seconds:
          type: integer
          minimum: 0
          default: 0
      example:
        months: 1
        days: 3

    AddSubtractRequest:
      type: object
      required: [start, duration]
      properties:
        start:
          type: string
          description: ISO 8601 date (`YYYY-MM-DD`) or datetime (`YYYY-MM-DDTHH:MM:SS`, optional offset).
          example: "2026-01-31"
        duration:
          $ref: "#/components/schemas/Duration"
        time_zone:
          type: string
          description: IANA time zone used to interpret naive datetimes.
          default: UTC
          example: America/New_York

    AddSubtractResponse:
      type: object
      required: [start, duration, result, clamped, time_zone]
      properties:
        start:
          type: string
          description: The `start` value exactly as sent.
        duration:
          type: object
          description: |
            The duration that was applied, with all six units present.
            Values are negative for `/subtract`.
          additionalProperties:
            type: integer
          example: { years: 0, months: 1, days: 0, hours: 0, minutes: 0, seconds: 0 }
        result:
          type: string
          description: |
            The calculated date or datetime in ISO 8601. Date-only when `start`
            was date-only; otherwise a datetime including its UTC offset.
          example: "2026-02-28"
        clamped:
          type: boolean
          description: |
            `true` if the day of the month was moved to the last valid day
            because the target month is shorter (e.g. Jan 31 + 1 month).
        time_zone:
          type: string
          description: The time zone used for the calculation.
          example: UTC

    DifferenceRequest:
      type: object
      required: [start, end]
      properties:
        start:
          type: string
          description: ISO 8601 date or datetime.
          example: "2024-02-29"
        end:
          type: string
          description: ISO 8601 date or datetime.
          example: "2026-03-01"
        time_zone:
          type: string
          description: IANA time zone used to interpret naive datetimes.
          default: UTC
        unit:
          type: string
          nullable: true
          enum: [days, weeks, months, years]
          description: Also express the difference in this unit.

    CalendarBreakdown:
      type: object
      description: The difference expressed in calendar units.
      required: [years, months, days]
      properties:
        years:
          type: integer
          minimum: 0
        months:
          type: integer
          minimum: 0
        days:
          type: integer
          minimum: 0

    DifferenceResponse:
      type: object
      required: [start, end, sign, calendar, total_days, total_seconds]
      properties:
        start:
          type: string
        end:
          type: string
        sign:
          type: integer
          enum: [1, -1]
          description: "`1` if `end` is on or after `start`; `-1` if `end` is before `start`."
        calendar:
          $ref: "#/components/schemas/CalendarBreakdown"
        total_days:
          type: integer
          minimum: 0
          description: Whole days between the two values.
        total_seconds:
          type: integer
          minimum: 0
          description: Total seconds between the two values.
        unit:
          type: string
          nullable: true
          description: The unit requested, or null if none was requested.
        value:
          type: integer
          nullable: true
          minimum: 0
          description: Full units in the difference, or null if no unit was requested.

    CurrentTimeResponse:
      type: object
      required: [timezone, date, time, utc_offset, iso_datetime]
      properties:
        timezone:
          type: string
          description: The IANA time zone used.
          example: America/Los_Angeles
        date:
          type: string
          format: date
          description: Current date in that zone, `YYYY-MM-DD`.
          example: "2026-11-16"
        time:
          type: string
          pattern: "^\\d{2}:\\d{2}:\\d{2}$"
          description: Current time in that zone, `HH:MM:SS` (24-hour).
          example: "16:52:03"
        utc_offset:
          type: string
          description: The zone's current offset from UTC (changes with daylight saving time).
          example: "-08:00"
        iso_datetime:
          type: string
          format: date-time
          description: The full ISO 8601 datetime with offset.
          example: "2026-11-16T16:52:03-08:00"

    CountdownResponse:
      type: object
      required: [target, timezone, now, has_passed, remaining, total_seconds, unit, value]
      properties:
        target:
          type: string
          description: The `target` value exactly as sent.
        timezone:
          type: string
          description: The time zone used.
        now:
          type: string
          format: date-time
          description: The moment the countdown was measured from.
        has_passed:
          type: boolean
          description: "`true` once the target has been reached (all numbers are then 0)."
        remaining:
          type: object
          required: [days, hours, minutes, seconds]
          properties:
            days: { type: integer, minimum: 0 }
            hours: { type: integer, minimum: 0, maximum: 23 }
            minutes: { type: integer, minimum: 0, maximum: 59 }
            seconds: { type: integer, minimum: 0, maximum: 59 }
        total_seconds:
          type: integer
          minimum: 0
        unit:
          type: string
          nullable: true
          description: The unit requested, or null if none was requested.
        value:
          type: integer
          nullable: true
          minimum: 0
          description: Full units remaining, or null if no unit was requested.

    HealthResponse:
      type: object
      required: [status, service, version, utc_time]
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
          example: date-time-tracker
        version:
          type: string
          example: 1.0.0
        utc_time:
          type: string
          format: date-time
          description: Current server time in UTC, ending in `Z`.

    ErrorResponse:
      type: object
      description: The shape of every error response from this API.
      required: [error_code, message]
      properties:
        error_code:
          type: string
          enum: [INVALID_INPUT, VALIDATION_ERROR, INTERNAL_ERROR]
          description: Machine-readable error category.
        message:
          type: string
          description: Human-readable explanation of the problem.
        field:
          type: string
          nullable: true
          description: |
            The request field that caused the error, if known. Nested fields
            use dot notation (e.g. `duration.days`).

  responses:
    InvalidInput:
      description: |
        **400 Bad Request.** The request has the right structure, but a value
        is not usable: an unparseable date/datetime or an unknown time zone.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            badDate:
              summary: Invalid date string
              value:
                error_code: INVALID_INPUT
                message: "'not-a-date' is not a valid ISO 8601 date or datetime"
                field: start
            badTimeZone:
              summary: Unknown time zone
              value:
                error_code: INVALID_INPUT
                message: "'Mars/Olympus_Mons' is not a valid IANA time zone"
                field: time_zone

    ValidationError:
      description: |
        **422 Unprocessable Content.** The JSON body does not match the
        expected schema: a required field is missing, a value has the wrong
        type, an unknown `unit`, a duration value is negative, or every
        duration value is 0.
        Only the first problem found is reported.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            wrongType:
              summary: Non-integer duration value
              value:
                error_code: VALIDATION_ERROR
                message: Input should be a valid integer, unable to parse string as an integer
                field: duration.days
            emptyDuration:
              summary: All duration values are zero
              value:
                error_code: VALIDATION_ERROR
                message: "Value error, duration must have at least one field greater than zero"
                field: duration
            missingField:
              summary: Required field missing
              value:
                error_code: VALIDATION_ERROR
                message: Field required
                field: end

    InternalError:
      description: "**500 Internal Server Error.** An unexpected error occurred on the server."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error_code: INTERNAL_ERROR
            message: An unexpected error occurred
            field: null
